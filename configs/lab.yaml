target:
  base_url: http://127.0.0.1:8000
  openapi_url: http://127.0.0.1:8000/openapi.json
  allowed_hosts:
    - 127.0.0.1
scanner:
  timeout: 10
  allow_write_tests: false
  allow_destructive_tests: false
principals:
  alice:
    type: credentials
    username: alice
    password_env: LAB_ALICE_PASSWORD
  bob:
    type: credentials
    username: bob
    password_env: LAB_BOB_PASSWORD
  charlie:
    type: credentials
    username: charlie
    password_env: LAB_CHARLIE_PASSWORD
  admin:
    type: credentials
    username: admin
    password_env: LAB_ADMIN_PASSWORD
